server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # BACKEND_URL is rewritten to http://<ipv4>:<port> at container start.
        # Do not use nginx's Docker DNS resolver here — on Docker Desktop for
        # Windows it often succeeds once, then fails after the TTL.
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_redirect ${BACKEND_URL}/ /;
        proxy_redirect ${BACKEND_URL} /;

        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
