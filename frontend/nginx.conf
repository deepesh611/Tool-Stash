server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Resolve the backend at request time so nginx can start even if
        # the "backend" hostname is not in DNS yet (container restart).
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        set $backend_upstream "${BACKEND_URL}";
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect ${BACKEND_URL}/ /;
        proxy_redirect ${BACKEND_URL} /;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
