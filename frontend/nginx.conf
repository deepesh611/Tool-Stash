server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Docker embedded DNS. Resolve at request time so a restart does not
        # fail if the backend hostname is not in DNS yet.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream "${BACKEND_URL}";
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect ${BACKEND_URL}/ /;
        proxy_redirect ${BACKEND_URL} /;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
